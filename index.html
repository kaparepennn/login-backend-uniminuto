<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Inicio de sesión</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#eef3f8}.card{width:min(92%,380px);background:#fff;padding:32px;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.1)}h1{text-align:center;margin-top:0;color:#263746}label{display:block;margin:14px 0 6px}input{width:100%;padding:11px;border:1px solid #cbd5df;border-radius:8px}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;cursor:pointer;background:#526f8a;color:#fff;font-size:16px}#mensaje{margin-top:18px;text-align:center;min-height:22px}.ok{color:#217a4b}.error{color:#b23b3b}</style></head>
<body><main class="card"><h1>Inicio de Sesión</h1><form id="loginForm"><label for="username">Usuario:</label><input type="text" id="username" name="username" required><label for="password">Contraseña:</label><input type="password" id="password" name="password" required><button type="submit">Iniciar Sesión</button></form><div id="mensaje" aria-live="polite"></div></main><script src="script.js"></script></body></html>
